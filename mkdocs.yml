  #     - Projeto Final: trabalhos/projeto-final.md

# exclude_docs ainda não é suportado pelo Zensical (o conteúdo é publicado
# mesmo assim, testado em build real) — veja
# https://zensical.org/compatibility/configuration/
# Caso volte a existir uma pasta de rascunhos, mantenha-a fora de docs_dir
# (ex.: rascunhos/ na raiz do repo), pois só o que está em docs/ é publicado.

# O plugin "search" não precisa mais ser declarado: a busca é embutida e
# automática no Zensical, herdando o idioma de theme.language (confirmado
# em build real — o search.json gerado já usa lang: ["pt-BR"]).
# O plugin "git-revision-date-localized" ainda não é suportado pelo Zensical
# (Tier 2, Backlog #18) — https://zensical.org/compatibility/plugins/
# Removido do requirements.txt até haver suporte nativo.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

